name: Verify FuengiUMA 2026
on: [push, pull_request]
defaults:
  run:
    working-directory: fuengiuma-2026
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fuengiuma-2026/pom.xml
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: fuengiuma-application
          path: fuengiuma-2026/target/fuengiuma-1.0.0.jar
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/demo.test.mjs
      - run: node scripts/sync-demo.mjs --check
      - run: node scripts/sync-demo.mjs --shared-repo --check
