spring.application.name=fuengiuma
server.address=127.0.0.1
server.port=${PORT:8097}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.error.include-message=never
spring.datasource.url=${FUENGIUMA_DB_URL:jdbc:h2:file:./data/fuengiuma;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${FUENGIUMA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
fuengiuma.demo.enabled=${FUENGIUMA_DEMO:true}
logging.level.org.hibernate.orm.deprecation=ERROR
